[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptofeed"]

[project]
name = "crypto-hft-infra"
version = "0.1.0"
description = "Async WebSocket market data feed handler with L2 order book reconstruction and latency monitoring"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abdelmalek Rhayoute"}]
dependencies = [
    "websockets>=12.0", "aiohttp>=3.9",
    "numpy>=1.24", "pandas>=2.0",
    "orjson>=3.9",
    "sortedcontainers>=2.4",
]
[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "pytest-cov", "ruff"]
